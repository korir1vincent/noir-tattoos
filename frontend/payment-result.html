<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — NOIR INK</title><link rel="stylesheet" href="/css/styles.css"></head><body class="admin-page"><main class="payment-box admin-card"><p class="eyebrow">NOIR INK · PAYMENT UPDATE</p><h1 id="heading">Checking your <em>payment.</em></h1><p id="result" class="muted">Please wait while we verify the transaction with the payment provider.</p><a class="btn btn-gold" href="/">RETURN TO STUDIO</a></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get('reference');if(!ref){document.querySelector('#result').textContent='Your payment provider is processing the payment. You can check your booking status using your booking reference.';return;}try{const r=await fetch('/api/payments/paystack/verify/'+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw new Error(d.message);document.querySelector('#heading').textContent='Deposit received.';document.querySelector('#result').textContent='Your payment has been verified. Booking reference: '+d.bookingReference+'. The studio will confirm your appointment.';}catch(e){document.querySelector('#result').textContent=e.message+' If you have completed payment, allow a short time for the webhook and contact the studio with your booking reference.';}})();
</script></body></html>
