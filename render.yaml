services:
  - type: web
    name: luxury-tattoo-studio
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 12h

      - key: FRONTEND_URL
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      - key: NOWPAYMENTS_API_KEY
        sync: false

      - key: NOWPAYMENTS_IPN_SECRET
        sync: false

      - key: NOWPAYMENTS_BASE_URL
        value: https://api.nowpayments.io/v1

      - key: NOWPAYMENTS_ALLOWED_CURRENCIES
        value: btc,eth,usdttrc20,usdterc20,usdc,usdcerc20

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
